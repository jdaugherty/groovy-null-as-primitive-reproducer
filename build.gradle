// Compiles and runs NullAsPrimitive.groovy with each Groovy version, once for invokedynamic and once for classic call
// sites:
//
//   ./gradlew reproduce
//   ./gradlew reproduce -PgroovyVersions=4.0.33,5.1.3
//
// A snapshot version is taken from the local Maven repository.
plugins {
    id 'groovy-base'
}

repositories {
    mavenCentral()
    mavenLocal {
        mavenContent { snapshotsOnly() }
        content { includeGroup 'org.apache.groovy' }
    }
}

List<String> groovyVersions = (providers.gradleProperty('groovyVersions').getOrElse('4.0.33,5.1.3,6.0.0')).split(',')*.trim()

def reproduce = tasks.register('reproduce') {
    group = 'verification'
    description = 'Runs the reproducer with each Groovy version, with and without invokedynamic.'
}

TaskProvider<JavaExec> previous = null
groovyVersions.each { String groovyVersion ->
    String name = groovyVersion.replaceAll(/[^A-Za-z0-9]/, '_')
    Configuration groovy = configurations.create("groovy_${name}")
    dependencies.add(groovy.name, "org.apache.groovy:groovy:${groovyVersion}")
    if ((groovyVersion.tokenize('.').first() as int) >= 6) {
        // classic call sites are a module of their own since Groovy 6
        dependencies.add(groovy.name, "org.apache.groovy:groovy-callsite:${groovyVersion}")
    }

    [true, false].each { boolean indy ->
        String variant = "${name}_${indy ? 'indy' : 'classic'}"
        def compile = tasks.register("compile_${variant}", GroovyCompile) {
            source = fileTree('src/main/groovy')
            classpath = groovy
            groovyClasspath = groovy
            destinationDirectory = layout.buildDirectory.dir("classes/${variant}")
            groovyOptions.optimizationOptions.indy = indy
        }
        TaskProvider<JavaExec> runBefore = previous
        def run = tasks.register("run_${variant}", JavaExec) {
            classpath = files(compile.map { it.destinationDirectory }) + groovy
            mainClass = 'NullAsPrimitive'
            args indy
            if (runBefore != null) {
                mustRunAfter runBefore
            }
            doFirst {
                println "== Groovy ${groovyVersion}, ${indy ? 'invokedynamic' : 'classic call sites'}"
            }
        }
        previous = run
        reproduce.configure { dependsOn run }
    }
}
